name: Build and push image

# Publishes the food-service image (used by the Deployment, the PreSync migrate Job and the
# food-sync CronJob) to Artifact Registry on every push to main.
#
# Keyless: GitHub's OIDC token is exchanged through Workload Identity Federation for a short-lived
# token of the ci-graphql-apollo-prisma-o2 service account, which can only write to the
# graphql-apollo-prisma-o2 repository. The federation provider only accepts tokens from main of
# the repo configured in gke-deploy.sh (GITHUB_REPO). gke-deploy.sh prints the two repository
# variables read below: GCP_WIF_PROVIDER and GCP_CI_SA (docs/DEPLOY.md).
on:
  # Every pull request builds the image (no cloud auth, no push); only main pushes.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/k8s-dev-412419/graphql-apollo-prisma-o2/food-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud
        id: gcp
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # <UTC yyyymmddHHMMSS>-<7-char sha>: sorts lexically by build time (Argo CD Image Updater's
      # "alphabetical" strategy picks the highest tag) and still identifies the commit.
      - name: Compute image tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # amd64 only: GKE's e2 nodes are x86_64.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=food-service
          cache-to: type=gha,mode=max,scope=food-service
