# PostgresInstance: the platform's "give me a Postgres server with these databases" API. An
# application declares one in its own namespace (k8s/db/postgres-instance.yaml) without knowing anything about
# Cloud SQL; the Composition in postgres-composition.yaml decides how it's provided.
#
# One instance, one or more databases, one login user per database: food-service uses the
# `fooddb` database with the `food_app` user; more databases can be added to the list later.
#
# Namespaced (Crossplane v2): the composed Cloud SQL resources and the connection Secret land in
# the same namespace as the PostgresInstance, next to the workloads that use them.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresinstances.platform.miqui.dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scope: Namespaced
  group: platform.miqui.dev
  names:
    kind: PostgresInstance
    plural: postgresinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: INSTANCE
          type: string
          jsonPath: .status.instanceName
        - name: PRIVATE-IP
          type: string
          jsonPath: .status.privateIp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - databases
                - connectionSecretName
              properties:
                version:
                  type: string
                  default: POSTGRES_16
                  enum: [POSTGRES_15, POSTGRES_16, POSTGRES_17]
                tier:
                  description: >-
                    Cloud SQL machine tier. The default (1 vCPU / 3.75 GiB) allows 100
                    connections in total, shared by every database's users; shared-core tiers
                    (db-f1-micro: 25, db-g1-small: 50) are too few for food-service's connection
                    pools at full HPA scale.
                  type: string
                  default: db-custom-1-3840
                diskSizeGb:
                  type: integer
                  default: 20
                  minimum: 10
                databases:
                  description: >-
                    Databases to create on the instance, each with its own login user. Users are
                    created through the Cloud SQL API, which makes them members of
                    cloudsqlsuperuser - separate credentials, not separate privileges.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, userName, passwordSecretRef]
                    properties:
                      name:
                        type: string
                      userName:
                        type: string
                      passwordSecretRef:
                        description: Secret (same namespace) holding this user's password.
                        type: object
                        required: [name, key]
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                connectionSecretName:
                  description: >-
                    Secret (same namespace) to write connection details to: privateIP,
                    connectionName and the server CA certificate.
                  type: string
            status:
              type: object
              properties:
                instanceName:
                  type: string
                privateIp:
                  type: string
                connectionName:
                  type: string
