# postgres_exporter, a standalone Deployment pointed at Cloud SQL's private IP (the instance itself
# is k8s/db/postgres-instance.yaml). Exports pg_stat_database/pg_locks/pg_stat_bgwriter/
# pg_stat_activity/pg_stat_statements for the "PostgreSQL Ops & Queries" Grafana dashboard.
# Cloud SQL's own metrics are in Cloud Monitoring as well. Connects as food_app to fooddb;
# pg_stat_database still covers every database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--collector.stat_statements"
            - "--collector.stat_statements.include_query"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
            # Cloud SQL is ENCRYPTED_ONLY, so TLS is required ("require": encrypted, server
            # identity not verified - the server CA is in cloudsql-connection if you want
            # verify-ca later).
            - name: DATA_SOURCE_URI
              value: "$(DB_HOST):5432/fooddb?sslmode=require"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: food-service-db-credentials
                  key: DB_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: food-service-db-credentials
                  key: DB_PASSWORD
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
      protocol: TCP
      name: metrics
