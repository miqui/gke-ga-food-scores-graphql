# Database credentials for food-service, the migrate hook and the food-sync CronJob, built by
# External Secrets from GCP Secret Manager (seeded from 1Password by gke-secrets-seed.sh). Also
# read, via the PostgresInstance's passwordSecretRef (k8s/db/postgres-instance.yaml), by Crossplane - which
# sets that Cloud SQL user's password from it - so the app and its database user can't drift.
#
# The user name isn't secret, so it's templated in here; it must match the userName of the
# database in postgres-instance.yaml. DB_PASSWORD_URLENC is the same password percent-encoded for use
# inside DATABASE_URL (the Deployment/Job/CronJob assemble the URL, because the host comes from
# the Crossplane-written cloudsql-connection Secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: food-service-db-credentials
  labels:
    app: food-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: food-service-db-credentials
    creationPolicy: Owner
    template:
      data:
        DB_USER: food_app
        DB_PASSWORD: "{{ .password }}"
        DB_PASSWORD_URLENC: "{{ .password | urlquery }}"
  data:
    - secretKey: password
      remoteRef:
        key: gql-postgres-food-password
