# Local development Postgres: `docker compose up -d postgres`, then use the
# DATABASE_URL from .env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gafood
      POSTGRES_PASSWORD: gafood
      POSTGRES_DB: gafood
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gafood -d gafood"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
